[package]
name = "wintercount"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/wintercount"
homepage = "https://github.com/savageAZfck/wintercount"
license = "MIT"
description = "Temporal policy provenance: pin the policy hash in force at every event, then answer 'what rules governed at time T' forever — named for the painted buffalo robes that recorded each year's defining event"
keywords = ["policy", "provenance", "audit", "governance", "temporal"]
categories = ["data-structures"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[features]
default = []
